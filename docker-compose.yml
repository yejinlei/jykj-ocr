# jykj_ocr —— docker compose 编排
#
#   docker compose up --build                 # 构建并启动服务
#   docker compose run --rm ocr python -m jykj_ocr /data/x.png   # 一次性任务
#
# 凭据直接注入:取消下面 environment 里的注释并填值。想用外部密钥文件,用
# `docker compose --env-file <路径> up`(可放在项目外,无需在本仓库建 .env)。
services:
  ocr:
    build: .
    image: jykj_ocr:latest
    container_name: jykj-ocr
    ports:
      - "${JYKJ_OCR_PORT:-8000}:8000"
    environment:
      JYKJ_OCR_CONFIG: /app/config/config.yaml
      # OPENAI_API_KEY: sk-your-key-here
      # OPENAI_BASE_URL: https://api.siliconflow.cn/v1   # 换平台只改这一行
    volumes:
      # 宿主机待处理文件（只读）
      - ./data:/data:ro
      # RapidOCR 模型权重持久化：首次下载后无需重复拉取
      - rapidocr-models:/opt/models
      # 想覆盖默认配置时取消注释：
      # - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rapidocr-models:
