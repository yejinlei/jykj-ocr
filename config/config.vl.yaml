# ============================================================================
# 示例 2 —— 只使用远程 VL 大模型(multimodal)
#
# 与 config.local.yaml 正好相反:本地引擎禁用,只跑远程多模态模型。
# 每个平台各读一把 key(见下方「两个平台各用一把 key」):
#   export JYKJ_OCR_MULTIMODAL_1_API_KEY=sk-sf...
#   export JYKJ_OCR_MULTIMODAL_2_API_KEY=sk-moark...
#
# 用法:
#   jykj-ocr serve -c config/config.vl.yaml
#   jykj-ocr -c config/config.vl.yaml 图片.png
#
# 两个平台顺序:base_url 写进条目,按列表顺序尝试——第 1 条成功就不碰第 2 条。
# 想要「每个都跑一遍挑最好的」请用 config.bestof.yaml。
# ============================================================================

strategy:
  max_retries: 1     # 第 1 个平台无文字/失败时,先重试自己 1 次,再降级到第 2 个
  retry_mode: no_text
  min_confidence: 0.7

output:
  format: markdown

pdf:
  max_pages: 50
  dpi: 200

engines:
  # 本地引擎刻意禁用 —— 这份配置完全不依赖离线推理
  - name: rapidocr
    lang: ch
    enabled: false
    timeout: 30

  # 第 1 个平台:硅基流动(模型 ID 带厂商前缀)
  # 读 JYKJ_OCR_MULTIMODAL_1_API_KEY(第 1 条 multimodal),否则回退共享的 OPENAI_API_KEY
  - name: multimodal
    enabled: true
    base_url: https://api.siliconflow.cn/v1
    model: PaddlePaddle/PaddleOCR-VL-1.5
    api_key:            # 留空 -> JYKJ_OCR_MULTIMODAL_1_API_KEY / OPENAI_API_KEY
    timeout: 180
    prompt: |
      请识别图片中的全部文字内容，按原文的版面顺序输出。
      只输出识别到的文字，不要翻译、不要解释、不要添加任何多余内容。
      如果是表格，请用 Markdown 表格输出。

  # 第 2 个平台:模力方舟(裸模型 ID)—— 第 1 个平台不可用时的兜底
  # 读 JYKJ_OCR_MULTIMODAL_2_API_KEY(第 2 条 multimodal)
  - name: multimodal
    enabled: true
    base_url: https://api.moark.com/v1
    model: PaddleOCR-VL-1.5
    api_key:
    timeout: 180
    prompt: |
      请识别图片中的全部文字内容，按原文的版面顺序输出。
      只输出识别到的文字，不要翻译、不要解释、不要添加任何多余内容。
      如果是表格，请用 Markdown 表格输出。

  # --- 两个平台各一套序号变量 ----------------------------------------------
  # 每条 multimodal 按 yaml 里的顺序读自己的一整套,数量不限:
  #   第 1 条 -> OPENAI_BASE_URL_1 / JYKJ_OCR_MULTIMODAL_1_API_KEY / _1_MODEL
  #   第 2 条 -> OPENAI_BASE_URL_2 / JYKJ_OCR_MULTIMODAL_2_API_KEY / _2_MODEL
  # 上面条目里写了 base_url/model 只是示例(写了就用 yaml,yaml 优先于环境变量);
  # 想让环境变量决定平台,把对应字段留空即可。
  # 全部不设时两条解析到同一把 OPENAI_API_KEY + 同一个 OPENAI_BASE_URL —— 那把
  # key 属于哪个平台,另一个平台就会 401 失败并被当作「无文字」继续降级。两个
  # 平台同时在线:
  #   export OPENAI_BASE_URL_1=https://api.siliconflow.cn/v1
  #   export OPENAI_BASE_URL_2=https://api.moark.com/v1
  #   export JYKJ_OCR_MULTIMODAL_1_API_KEY=sk-sf...     # 硅基流动
  #   export JYKJ_OCR_MULTIMODAL_2_API_KEY=sk-moark...  # 模力方舟
  # 想让序号不随条目增删漂移,在条目里钉住:instance: 1
