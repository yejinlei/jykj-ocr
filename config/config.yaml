# jykj_ocr 配置示例
# 真实密钥不要写在这里；用环境变量或 .env（已在 .gitignore 中）。

# 策略链：按顺序尝试，前面的引擎失败/无文字时自动切换到下一个。
#
# name —— 命名预设（默认 fallback；API/CLI 可用 strategy_name 一次性覆盖）:
#   local             只用本地引擎（rapidocr 等），远程引擎全部禁用
#   vl                只用 VL 大模型（siliconflow/multimodal），本地引擎禁用
#   seq               按 engines 顺序回退（retry_mode=no_text，默认行为）
#   seq-any           seq + any 重试谓词 + 阅读顺序重排（= quality）
#   seq-low_conf      seq + low_confidence 重试
#   seq-line_overlap  seq + line_overlap 重试（无文字或窜行即降级）
#   bestof            所有引擎各跑一次，按 score 选最佳（默认 smart 模式）
#   bestof-smart      同上；smart = 置信度 − 窜行惩罚 + 文本长度奖赏
#   bestof-fastest    按耗时（elapsed_ms）最低选
#   bestof-confidence 按平均置信度最高选
#   bestof-longest    按识别文本最长选
#   bestof:<mode>     等价于 bestof-mode（mode 见上）
#   fallback          seq 的旧别名（保留兼容）
#   quality           seq-any 的旧别名（保留兼容）
# retry_mode —— 精细控制（仅 seq* 与 legacy 预设使用；bestof* 无需设置）:
#   no_text         无文字时重试（默认）
#   low_confidence  平均置信度 < min_confidence 时重试
#   line_overlap    无文字或版面疑似窜行时重试
#   any             低置信度或窜行任一命中即重试
#   none            首次成功即接受
strategy:
  name: fallback
  max_retries: 1
  retry_mode: no_text
  min_confidence: 0.7

output:
  format: markdown
  # reorder_lines: true   # 按区域坐标重建阅读顺序（quality 预设自动开启）

pdf:
  max_pages: 50
  dpi: 200

engines:
  # 本地引擎：离线可用，无需 API key
  - name: rapidocr
    lang: ch
    enabled: true

  # 硅基流动多模态 OCR 大模型
  - name: siliconflow
    model: PaddlePaddle/PaddleOCR-VL-1.5
    base_url: https://api.siliconflow.cn/v1
    # api_key 建议用环境变量 SILICONFLOW_API_KEY 提供
    temperature: 0.0
    timeout: 180
    # image_format: jpeg   # 体积更小的上传格式
    prompt: |
      请识别图片中的全部文字内容，按原文的版面顺序输出。
      只输出识别到的文字，不要翻译、不要解释、不要添加任何多余内容。
      如果是表格，请用 Markdown 表格输出。

  # 通用 OpenAI 兼容端点（阿里云百炼、腾讯、智谱、本地 vLLM 等）
  # base_url / api_key 留空，由环境变量 OPENAI_BASE_URL / OPENAI_API_KEY 提供，
  # 这样切换平台只需改一对环境变量，无需改此文件。
  # model 也留空：multimodal 会回退到 MultimodalEngine.DEFAULT_MODEL
  # （PaddlePaddle/PaddleOCR-VL-1.5，硅基流动上有效）；指向其他平台时用
  # --model 或 POST /config 指定该平台可用的视觉模型。
  - name: multimodal
    enabled: false
    # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # model: qwen-vl-max   # 阿里云模型名；换平台时改为该平台可用模型
