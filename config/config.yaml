# jykj_ocr 配置示例
# 真实密钥推荐走环境变量(export OPENAI_API_KEY=...)或 Docker -e 注入。
# 若确实要写进下面的条目，该文件必须先加进 .gitignore —— 否则就是提交密钥。

# 策略链：按顺序尝试，前面的引擎失败/无文字时自动切换到下一个。
#
# ⚠️ 下面的 name 字段**不生效**，只是文档——build_pipeline 从不读它切换预设，
#    预设只能由接口一次性应用（CLI --strategy-name / HTTP strategy_name /
#    /ocr/{preset} 路由）。yaml 里真正生效的只有：
#      bestof_mode   单独写它 → 组装 BestofEngine 而非 StrategyEngine
#      max_retries / retry_mode / min_confidence
#    「只用本地 / 只用远程」靠 engines 条目里的 enabled: false。
#
# name 可取的预设（仅供接口使用时的速查表）:
#   local             只用本地引擎（rapidocr 等），远程引擎全部禁用
#   vl                仅 1 条远程 VL 大模型（config 里第一条已启用的），本地引擎禁用
#   seq               按 engines 顺序回退（retry_mode=no_text，默认行为）
#   seq-any           seq + any 重试谓词 + 阅读顺序重排（= quality）
#   seq-low_conf      seq + low_confidence 重试
#   seq-line_overlap  seq + line_overlap 重试（无文字或窜行即降级）
#   cascade           seq 但 max_retries=0（同一引擎不重试，直接降级）
#   cascade-low_conf  cascade + low_confidence 重试
#   cascade-line_overlap cascade + line_overlap 重试
#   bestof            所有引擎各跑一次，按 score 选最佳（默认 smart 模式）
#   bestof-smart      同上；smart = 置信度 − 窜行惩罚 + 文本长度奖赏 + 语义流畅度
#   bestof-fastest    按耗时（elapsed_ms）最低选
#   bestof-confidence 按平均置信度最高选
#   bestof-longest    按识别文本最长选
#   bestof-fluency    按语义流畅度选（短语密度 + CJK 标点 − 单字碎片惩罚）
#   bestof:<mode>     等价于 bestof-<mode>（mode 见上）
#   fallback          seq 的旧别名（保留兼容）
#   quality           seq-any 的旧别名（保留兼容）
# retry_mode —— 精细控制（仅 seq* / cascade* 与 legacy 预设使用；bestof* 无需设置）:
#   no_text         无文字时重试（默认）
#   low_confidence  平均置信度 < min_confidence 时重试
#   line_overlap    无文字或版面疑似窜行时重试
#   any             低置信度或窜行任一命中即重试
#   none            首次成功即接受
strategy:
  name: fallback
  max_retries: 1
  retry_mode: no_text
  min_confidence: 0.7

output:
  format: markdown
  # reorder_lines: true   # 按区域坐标重建阅读顺序（quality 预设自动开启）

pdf:
  max_pages: 50
  dpi: 200

# ============================================================================
# engines —— 可列出任意数量的 multimodal 条目，每条指向一个平台的一个模型
# ============================================================================
#
# name: multimodal 是一个「类型」，不是实例 id。每条 entry 都会实例化为一个
# 独立的 MultimodalEngine，由 (base_url, model, api_key) 区分。三种常见搭配:
#   1) 同厂商不同模型  —— base_url/api_key 相同，model 不同
#   2) 不同厂商        —— base_url 不同（siliconflow / 火山 ark / 百炼 / 本地 vLLM）
#   3) 同厂商不同账号  —— base_url/model 相同，api_key 不同
#
# 相同 (base_url, model, api_key) 的多条 entry 会在解析时合并为一条（第一条胜出），
# 不同平台/不同模型/不同 key 各自独立实例化。
#
# 支持的 alias：
#   multi / multimodal / openai / openai-compat / openai-compatible / llm
#   sf / silicon-flow / silicon_flow / siliconflow  →  multimodal
#
# 只有两个引擎类型：rapidocr 和 multimodal。平台不是引擎——它是条目里的
# base_url + model 组合。下面的示例条目（硅基流动）就是 multimodal 的一种写法。
#
# 每条字段（未列出的键都进 extra，不影响解析）：
#   name        类型名或 alias（default: multimodal）
#   enabled     true/false（default: true）
#   base_url    OpenAI 兼容端点 URL。留空时读 OPENAI_BASE_URL_<N>(<N> = 第 N 条
#               multimodal),再回退共享的 OPENAI_BASE_URL / JYKJ_OCR_MULTIMODAL_BASE_URL;
#               全都无则报错(不做平台回退——把 A 平台的 key 发给 B 平台只会
#               得到一个说不清原因的 HTTP 401)
#   model       模型 ID。留空时读 JYKJ_OCR_MULTIMODAL_<N>_MODEL,再回退
#               JYKJ_OCR_MULTIMODAL_MODEL,最后退化为 PaddleOCR-VL-1.5
#               (裸 ID,模力方舟可用;其他平台请显式写全)
#   api_key     留空则按序号读 JYKJ_OCR_MULTIMODAL_<N>_API_KEY,再回退共享变量
#               (单账号直接写也行;该 yaml 需已 gitignore)
#   temperature 采样温度（default: 0.0）
#   timeout     单页耗时上限，秒（default: 120）
#   max_tokens  最大 token 数
#   prompt      用户提示词
#   prompt_file 从文件读取提示词（等价 prompt 的懒加载）
#   lang        本地 OCR 语言（仅 rapidocr 使用）
#
# 环境变量按「类型 + 序号」命名:序号 1..N 是「同类型里的第 N 条」,各类型独立
# 计数,数量不限。凭据走「通用」一对 OPENAI_API_KEY / OPENAI_BASE_URL(适配任意
# 平台,硅基流动只是其中之一),不带序号 = 该类型所有条目共享;带序号 = 每条
# 各读各的,所以多平台、同厂商多账号都可以只靠环境变量区分,不写进 yaml。
# ============================================================================

engines:
  # 本地引擎：离线可用，无需 API key
  - name: rapidocr
    lang: ch
    enabled: true
    # 本地 OCR 单页耗时上限。超时抛 EngineError，strategy 会切到下一个引擎。
    # 兰亭序实测 ~10s；30s 给大文档留余量。
    timeout: 30

  # ========================================================================
  # 远程引擎 —— 全部走通用 OpenAI 兼容协议
  #
  # base_url 一律留空，由环境变量的「通用」一对决定平台：
  #   OPENAI_API_KEY=<你的平台 key>
  #   OPENAI_BASE_URL=https://api.moark.com/v1
  # 换平台只改这两个环境变量的值（本文件不动）。yaml 里只写各条目的差异（model/prompt）。
  # 注意：不同厂商的 model ID 可能不同（moark 用裸 ID，硅基流动要带厂商前缀），
  # 换平台后若报「模型不存在」，按目标平台改一下下面的 model 即可。
  # 不带序号的变量被同类型所有条目共享；要给每条分不同的端点/模型/key，
  # 改用 *_1 / *_2 序号变量（见下方「其他平台示例」）。
  # ========================================================================

  # 模力方舟 moark：PaddleOCR-VL-1.5（已启用，实测可用）
  # 第 1 条 multimodal -> base_url 留空时读 OPENAI_BASE_URL_1（再回退 OPENAI_BASE_URL）
  #   key 读 JYKJ_OCR_MULTIMODAL_1_API_KEY（不设则回退共享的 OPENAI_API_KEY）
  # 注意：moark 用「裸模型 ID」，不带厂商前缀——写 PaddleOCR-VL-1.5，
  # 不是硅基流动的 PaddlePaddle/PaddleOCR-VL-1.5。
  - name: multimodal
    enabled: true
    base_url:            # 留空 -> OPENAI_BASE_URL_1 / OPENAI_BASE_URL
    model: PaddleOCR-VL-1.5
    timeout: 180
    prompt: |
      请识别图片中的全部文字内容，按原文的版面顺序输出。
      只输出识别到的文字，不要翻译、不要解释、不要添加任何多余内容。
      如果是表格，请用 Markdown 表格输出。

  # 同一平台、不同模型（同厂商不同模型组合，已启用）
  # 第 2 条 multimodal -> 读 JYKJ_OCR_MULTIMODAL_2_API_KEY（默认不设，回退共享 key）
  # 实测 Qwen3-VL-30B 在兰亭序上输出简体+标点，还多认出了 PaddleOCR 漏掉的落款行
  # 输出质量更高，但响应也更慢（~13s vs ~7s）
  - name: multimodal
    enabled: true
    base_url:            # 留空 -> 读同一个 OPENAI_BASE_URL
    model: Qwen3-VL-30B-A3B-Instruct
    timeout: 180
    prompt: |
      请识别图片中的全部文字内容，按原文的版面顺序输出。
      只输出识别到的文字，不要翻译、不要解释、不要添加任何多余内容。
      如果是表格，请用 Markdown 表格输出。

  # --- 其他平台示例（按需启用） -------------------------------------------
  # 每个条目按书写顺序读自己的一套序号变量，yaml 里可以完全不写：
  #   端点  OPENAI_BASE_URL_1 / OPENAI_BASE_URL_2 / …
  #   key   JYKJ_OCR_MULTIMODAL_1_API_KEY / _2_ / …
  #   model JYKJ_OCR_MULTIMODAL_1_MODEL / _2_ / …
  # 序号 1..N 是「同类型里的第 N 条」，各类型独立计数，数量不限。
  # 下面这些条目把 base_url/model 写进 yaml 只是示例（yaml 优先于环境变量）；
  # 想让环境变量决定，把对应字段留空即可。

  # 阿里云百炼
  # - name: multimodal
  #   enabled: false
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   model: qwen-vl-max-latest
  #   timeout: 180

  # 火山方舟（豆包 / 通用 VLM）
  # - name: multimodal
  #   enabled: false
  #   base_url: https://ark.cn-beijing.volces.com/api/v3
  #   model: <你的 endpoint 或 model ID>
  #   timeout: 180

  # 本地 vLLM / Ollama（离线私有化部署）
  # - name: multimodal
  #   enabled: false
  #   base_url: http://localhost:8000/v1
  #   model: Qwen/Qwen2.5-VL-72B-Instruct
  #   timeout: 180

  # 硅基流动：与其他平台一样，就是一个 base_url + model 条目。模型 ID 要带
  # 厂商前缀（PaddlePaddle/PaddleOCR-VL-1.5），与模力方舟的裸 ID 不同。
  # - name: multimodal
  #   enabled: false
  #   base_url: https://api.siliconflow.cn/v1
  #   model: PaddlePaddle/PaddleOCR-VL-1.5
  #   timeout: 180
  #   prompt: |
  #     请识别图片中的全部文字内容，按原文的版面顺序输出。

  # 同厂商不同账号：base_url/model 相同，换一把 key 即可。两条都用序号变量,
  # 不写进 yaml:
  #   export JYKJ_OCR_MULTIMODAL_1_API_KEY=sk-主账号...
  #   export JYKJ_OCR_MULTIMODAL_2_API_KEY=sk-第二账号...
  # - name: multimodal
  #   enabled: false
  #   base_url: https://api.moark.com/v1
  #   model: PaddleOCR-VL-1.5
