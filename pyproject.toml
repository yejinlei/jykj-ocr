[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jykj-ocr"
version = "0.1.0"
description = "Multi-engine OCR: local RapidOCR + multimodal OCR LLM (SiliconFlow, OpenAI-compatible)"
requires-python = ">=3.10"
authors = [{ name = "jykj" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "requests>=2.28",
    "python-multipart",
    "Pillow>=9.0",
]

[project.optional-dependencies]
rapidocr = ["rapidocr-onnxruntime"]
dev = ["pytest>=7", "httpx>=0.27"]   # httpx: FastAPI TestClient 依赖

[project.scripts]
jykj-ocr = "jykj_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
